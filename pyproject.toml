[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "raggrade"
version = "0.1.0"
description = "Evaluate retrieval-augmented generation: retrieval quality, faithfulness, answer relevance and citation coverage, with an offline judge for CI and an LLM judge for depth."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Nikhil Obuleni"}]
dependencies = ["numpy>=1.24", "scikit-learn>=1.3", "pydantic>=2.0"]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.30"]
dev = ["pytest>=7", "pytest-cov", "ruff"]

[project.scripts]
raggrade = "raggrade.cli:main"

[tool.setuptools.packages.find]
include = ["raggrade*"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
